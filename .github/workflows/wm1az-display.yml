name: WM1A-Z display

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  display:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Test portable display and C touch mapping
        run: DISPLAY_TEST_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' sh scripts/test-display.sh
      - name: Check pinned backend patches
        run: |
          git submodule update --init --depth 1 libs/imgui libs/glfw
          git -C libs/imgui apply --check ../imgui.patch
          git -C libs/imgui apply ../imgui.patch
          git -C libs/glfw apply --check ../glfw.patch
          git -C libs/glfw apply ../glfw.patch
      - name: Check device and desktop backend syntax
        run: |
          for mode in device desktop; do
            flags=''
            if [ "$mode" = desktop ]; then flags='-DDESKTOP'; fi
            c++ -std=c++11 -fsyntax-only $flags -DIMGUI_USER_CONFIG='"../../src/imgui.config.h"' -DGLFW_INCLUDE_NONE -Ilibs/imgui -Ilibs/glfw/include libs/imgui/backends/imgui_impl_glfw.cpp
            c++ -std=c++11 -fsyntax-only $flags -DIMGUI_USER_CONFIG='"../../src/imgui.config.h"' -Ilibs -Ilibs/glad/include -Ilibs/glad/include/KHR -Ilibs/imgui libs/imgui/backends/imgui_impl_opengl3.cpp
          done
          cc -std=c99 -D_GNU_SOURCE -fsyntax-only -Ilibs/glfw/include libs/glfw/src/null_window.c libs/glfw/src/null_monitor.c libs/glfw/src/init.c
      - name: Install text test dependencies
        run: sudo apt-get update && sudo apt-get install -y libicu-dev libsqlite3-dev
      - name: Test Unicode metadata and font clipping
        run: TEXT_TEST_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' sh scripts/test-text.sh
